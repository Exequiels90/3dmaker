<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Login - Sistema de Gestión 3D') }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --ink: #17181c;
            --accent: #ff5a1f;
            --paper: #f7f6f3;
            --border: #e9e7e2;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--ink);
            background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
            background-size: 22px 22px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        h3, .brand-mark { font-family: 'Poppins', sans-serif; }
        .login-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.35);
            padding: 44px 40px;
            width: 100%;
            max-width: 400px;
        }
        .login-header { text-align: center; margin-bottom: 30px; }
        .brand-mark {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: var(--ink);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin: 0 auto 16px;
        }
        .login-header h3 {
            font-weight: 700;
            font-size: 1.3rem;
            color: var(--ink);
            margin-bottom: 4px;
        }
        .login-header p { color: #85888f; font-size: 0.9rem; margin: 0; }
        .form-label { font-weight: 600; font-size: 0.85rem; color: var(--ink); }
        .form-control {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 11px 14px;
            background: var(--paper);
        }
        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255,90,31,0.15);
            background: #fff;
        }
        .input-group-text {
            background: var(--paper);
            border: 1px solid var(--border);
            color: #85888f;
        }
        .btn-login {
            background: var(--ink);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            color: #fff;
        }
        .btn-login:hover { background: var(--accent); color: #fff; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="brand-mark"><i class="fas fa-cube"></i></div>
            <h3>{{ _('Sistema de Gestión 3D') }}</h3>
            <p>{{ _('Inicia sesión para continuar') }}</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label for="username" class="form-label">{{ _('Usuario') }}</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" class="form-control" id="username" name="username" required autofocus>
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">{{ _('Contraseña') }}</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-login w-100">
                <i class="fas fa-sign-in-alt me-2"></i> {{ _('Iniciar Sesión') }}
            </button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
